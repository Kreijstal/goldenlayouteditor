name: Deploy Editor to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Setup pinned Rust and WASM target
        run: rustup toolchain install 1.88.0 --profile minimal --component rust-docs --target wasm32-unknown-unknown

      - name: Install pinned WASM glue generator
        run: cargo +1.88.0 install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Check WASM C compiler
        run: clang --version

      - name: Build site (bundle.js)
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      # The in-browser shell's rc and the commands the page runs (scripts/build-wanix.sh)
      - name: Build wanix-rc.wasm and wanix-command.wasm
        run: npm run build:wanix

      # GitHub Pages lets browsers keep files 10 minutes: name this build's bundle
      # in the page, so a reload after a deploy gets it
      - name: Version bundle.js in index.html
        run: sed -i 's|src="bundle.js"|src="bundle.js?v=${{ github.sha }}"|' public/index.html && grep -q "bundle.js?v=" public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
